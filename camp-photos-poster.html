<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Camp Photos Poster — New Hope Church</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="pictures/icons/favicon-32.png">
<link rel="apple-touch-icon" href="pictures/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/style.css?v=2026.11.26.14">
<link rel="stylesheet" href="css/camp-photos.css?v=2026.11.26.14">
</head>
<body class="cp-poster-page" data-photos="poster">

<div class="cp-poster-tools">
  <p>Print this poster and put it up around the camp. Scanning the code opens the camp photo page.</p>
  <button class="btn btn-primary" type="button" id="cp-print">Print poster</button>
</div>

<div class="cp-poster">
  <span class="cp-poster-logo">New Hope Church</span>
  <span class="cp-poster-tag">New Hope Youth Camp 2026</span>
  <h1 class="display">Snap it.<br>Share it.</h1>
  <p class="cp-poster-lead">Scan with your phone camera to send your camp photos</p>
  <div class="cp-qr" id="cp-poster-qr"></div>
  <p class="cp-poster-small">The best ones go into the camp album</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/script.js?v=2026.11.26.14"></script>
<script src="js/config.js?v=2026.11.26.14"></script>
<script src="js/camp-photos.js?v=2026.11.26.14"></script>
</body>
</html>
