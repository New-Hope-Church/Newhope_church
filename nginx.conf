server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Security headers are kept in one file and included in every location,
    # because nginx drops server-level add_header lines in any location that
    # sets its own headers.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # CSS and JS are always linked with ?v=<version>, so a new version gets a
    # new URL and browsers can keep the old one for a year.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Images are not versioned, so a replaced image must show up within a week.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
